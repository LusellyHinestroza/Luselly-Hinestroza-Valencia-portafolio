<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
         integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="../admin/admin.css">
        <title>Portafolio luselly</title>
    </head>
    <body>
        <h1 class="tituloPrincipal">CREAR CONTENIDO</h1>

        <!--CREAR CV ESTUDIOS............................................................-->
        <section class="Crear">
            <div class="contenedorEstudios">
                <div class="tituEstudios">
                    <h2>CREAR ESTUDIOS</h2>
                </div>
                <div id="mensajeEstudios"></div>
                <form id="formEstudios" class="formEstudios">
                    <div class="grupoInputEstudios">
                        <label  for="nombreEstudio">
                            Nombre del lugar de estudio
                        </label>

                        <input 
                            type="text"
                            id="nombreEstudio"
                            name="nombreEstudio"
                            placeholder="Ej: SENA"
                            class="form-control"
                            maxlength="200" 
                        >
                    </div>

                    <div class="grupoInputEstudios">
                        <label for="nombreProfesion">
                            Nombre de la profesión
                        </label>

                        <input 
                            type="text"
                            id="nombreProfesion"
                            name="nombreProfesion"
                            placeholder="Ej: Técnico en Sistemas"
                            class="form-control"
                            maxlength="200" 
                        >
                    </div>

                    <div class="descripcionEstudio">
                        <label for="descripcionEstudio">
                            Descripción de la profesión
                        </label>

                        <textarea 
                            id="descripcionEstudio"
                            name="descripcionEstudio"
                            placeholder="Describe tus estudios......"
                            class="form-control"
                            rows="8"
                            
                        ></textarea>
                    </div>

                    <div class="grupoInputEstudio">
                        <label for="paginaEstudio">
                            Página o enlace relacionado
                        </label>

                        <input 
                            type="url"
                            id="paginaEstudio"
                            name="paginaEstudio"
                            class="form-control"
                            placeholder="https://ejemplo.com"
                        >
                    </div>

                    <button id="guardar" type="submit" class="btnCrearEstudio">
                        Guardar contenido
                    </button>
                </form>
            </div>


            <!--ESPERIENCIA.....................................................................-->
            <div class="contenedorExperiencia">
                <div class="tituloExperiencia">
                    <h2>CREAR ESPERIENCIA</h2>
                </div>
                <div id="mensajeExperiencia"></div>
                <form id="formularioExperiencia" class="formularioExperiencia">
                    <div class="grupoInputExperiencia">
                        <label for="nombreExperiencia">
                            Nombre del lugar de trabajo
                        </label>

                        <input 
                            type="text"
                            id="nombreExperiencia"
                            name="nombreExperiencia"
                            placeholder="Ej: KRIKA"
                            maxlength="200" 
                            required
                        >
                    </div>

                    <div class="grupoInput">
                        <label for="nombreCargo">
                            Nombre del cargo
                        </label>

                        <input 
                            type="text"
                            id="nombreCargo"
                            name="nombreCargo"
                            placeholder="Ej: Técnico en Sistemas"
                            maxlength="200"
                            required
                        >
                    </div>

                    <div class="grupoInput">
                        <label for="descripcionExperiencia">
                            Descripción de la profesión
                        </label>

                        <textarea 
                            id="descripcionExperiencia"
                            name="descripcionExperiencia"
                            placeholder="Describe tus experiencia..."
                            rows="8"
                            required
                        ></textarea>
                    </div>

                    <button type="submit" class="btnCrearExperiencia">
                        Guardar contenido
                    </button>
                </form>

            </div>

            <!--HABILIDAD.........................................................................-->
            <div class="contenedorHabilidad">
                <div class="tituloHabilidad">
                    <h2>CREAR HABILIDAD</h2>
                </div>
                <div id="mensajeHabilidad"></div>
                <form id="formularioabilidad" class="formularioabilidad">
                    <div class="grupoInputHabilidad">
                        <label for="nombreHabilidad">
                            Nombre de la habilidad
                        </label>

                        <input 
                            type="text"
                            id="nombreHabilidad"
                            name="nombreHabilidad"
                            placeholder="Ej: Krika"
                            maxlength="200"
                            required
                        >
                    </div>

                     <div class="grupoInput">
                        <label for="descripcionHabilidad">
                            Descripción de la hablidad
                        </label>

                        <textarea 
                            id="descripcionHabilidad"
                            name="descripcionHabilidad"
                            placeholder="Describe tu habilidad..."
                            rows="8"
                            required
                        ></textarea>
                    </div>


                    <div class="grupoInputHabilidad">
                        <label for="imagenHabilidad">
                            Enlace de la imagen
                        </label>

                        <input 
                            type="url"
                            id="imagenHabilidad"
                            name="imagenHabilidad"
                            placeholder="https://ejemplo.com"
                        >
                    </div>

                    <button type="submit" class="btnCrearHabilidad">
                        Guardar contenido
                    </button>
                </form>

            </div>
        

        <!--publicaciones....................................................................-->

        

            <div class="contenedorPublicaciones">
                <div class="tituloPublicaciones">
                    <h2>CREAR PUBLICACION</h2>
                </div>
                 <div id="mensajePublicaciones"></div>
                <form id="formularioPublicaciones" class="formularioPublicaciones">

                    <div class="grupoInputPublicaciones">
                        <label for="imagenPublicaciones">
                            Enlace de la imagen
                        </label>

                        <input 
                            type="url"
                            id="imagenPublicaciones"
                            name="imagenPublicaciones"
                            placeholder="https://ejemplo.com"
                        >
                    </div>
            
                    <div class="grupoInputPublicaciones">
                        <label for="nombreProyectoPublicaciones">
                            Nombre del proyecto
                        </label>

                        <input 
                            type="text"
                            id="nombreProyectoPublicaciones"
                            name="nombreProyectoPublicaciones"
                            placeholder="Ej: Calculadora"
                            maxlength="200" 
                            required
                        >
                    </div>

                    <div class="grupoInputPublicaciones">
                        <label for="nombreLenguajePublicaciones">
                            Nombre del lenguaje
                        </label>

                        <input 
                            type="text"
                            id="nombreLenguajePublicaciones"
                            name="nombreLenguajePublicaciones"
                            placeholder="Ej: HTML"
                            required
                        >
                    </div>

                     <div class="grupoInput">
                        <label for="descripcionPublicaciones">
                            Descripción de tu codigo
                        </label>

                        <textarea 
                            id="descripcionPublicaciones"
                            name="descripcionPublicaciones"
                            placeholder="Describe tu codigo..."
                            rows="8"
                            required
                        ></textarea>
                    </div>

                  

                    <div class="grupoInputPublicaciones">
                        <label for="imagenProyectoPublicaciones">
                            Enlace de la imagen
                        </label>

                        <input 
                            type="url"
                            id="imagenProyectoPublicaciones"
                            name="imagenProyectoPublicaciones"
                            placeholder="https://ejemplo.com"
                        >
                    </div>

                    <div class="grupoInputPublicaciones">
                        <label for="videoPublicaciones">
                            Seleccionar video
                        </label>

                        <input 
                            type="file"
                            id="videoPublicaciones"
                            name="videoPublicaciones"
                            accept="video/*"
                        >
                    </div>
                    <div class="grupoInputPublicaciones">
                        <label for="videoEnlacePublicaciones">
                            Enlace del video
                        </label>

                        <input 
                            type="url"
                            id="videoEnlacePublicaciones"
                            name="videoEnlacePublicaciones"
                            placeholder="https://youtube.com/watch?v=..."
                        >
                    </div>
                    <div class="grupoInputPublicaciones">
                        <label for="codigoPublicaciones">
                            Código del proyecto
                        </label>

                        <textarea 
                            id="codigoPublicaciones"
                            name="codigoPublicaciones"
                            placeholder="Escribe tu código aquí..."
                            rows="8"
                        ></textarea>
                    </div>

                    <div class="grupoInputPublicaciones">
                        <label for="paginaCodigo">
                            Página o enlace relacionado
                        </label>

                        <input 
                            type="url"
                            id="paginaCodigo"
                            name="paginaCodigo"
                            class="form-control"
                            placeholder="https://ejemplo.com"
                        >
                    </div>
                    <button type="submit" class="btnCrearPublicaciones">
                        Guardar contenido
                    </button>
                </form>

            </div>

        

        <!--SEPCION PORTAFOLIO CARDS..........................................................-->
       

            <div class="contenedorCards">
                <div class="tituloCards">
                    <h2>CREAR CARDS</h2>
                </div>
                <form class="formularioCards">

                    <div class="grupoInputCards">
                        <label for="videoCards">
                            Seleccionar video
                        </label>

                        <input 
                            type="file"
                            id="videoCards"
                            name="videoCards"
                            accept="video/*"
                        >
                    </div>
                    <div class="grupoInputCards">
                        <label for="videoCards">
                            Enlace del video
                        </label>

                        <input 
                            type="url"
                            id="videoCards"
                            name="videoCards"
                            placeholder="https://youtube.com/watch?v=..."
                        >
                    </div>

                    <div class="grupoInputCards">
                        <label for="nombreCards">
                            Nombre del proyecto
                        </label>

                        <input 
                            type="text"
                            id="nombreCards"
                            name="nombreCards"
                            placeholder="Ej: Calculadora"
                            maxlength="200" required

                        >
                    </div>
                    <div class="grupoInput">
                        <label for="descripcionCards">
                            Descripción de tu codigo
                        </label>
                        <textarea 
                            id="descripcionCards"
                            name="descripcionCards"
                            placeholder="Describe tu proyecto..."
                            rows="8"
                            required
                        ></textarea>
                    </div>
                    <div class="grupoInputCards">
                        <label for="paginaCards">
                            Enlace del git
                        </label>

                        <input 
                            type="url"
                            id="paginaCards"
                            name="paginaCards"
                            placeholder="https://ejemplo.com"
                        >
                    </div>
                    <div class="grupoInputCards">
                        <label for="paginaCards">
                            Página o enlace relacionado
                        </label>

                        <input 
                            type="url"
                            id="paginaCards"
                            name="paginaCards"
                            placeholder="https://ejemplo.com"
                        >
                    </div>

                    <div class="grupoInputCards">
                        <label for="nombreCards">
                            Nombre del lenguaje 1
                        </label>

                        <input 
                            type="text"
                            id="nombreCards"
                            name="nombreCards"
                            placeholder="Ej: HTML"
                            maxlength="200"
                            
                        >
                    </div>
                    <div class="grupoInputCards">
                        <label for="nombreCards">
                            Nombre del lenguaje 2
                        </label>

                        <input 
                            type="text"
                            id="nombreCards"
                            name="nombreCards"
                            placeholder="Ej: HTML"
                            maxlength="200"
                            
                        >
                    </div>
                    <div class="grupoInputCards">
                        <label for="nombreCards">
                            Nombre del lenguaje 3
                        </label>

                        <input 
                            type="text"
                            id="nombreCards"
                            name="nombreCards"
                            placeholder="Ej: HTML"
                            maxlength="200"
                            
                        >
                    </div>
                    <div class="grupoInputCards">
                        <label for="nombreCards">
                            Nombre del lenguaje 4
                        </label>

                        <input 
                            type="text"
                            id="nombreCards"
                            name="nombreCards"
                            placeholder="Ej: HTML"
                            maxlength="200"
                            
                        >
                    </div>
                    <button type="submit" class="btnCrearCards">
                        Guardar contenido
                    </button>
                </form>

            </div>

            

        </section>
    
    <script src="./admin.js"></script>  
    </body>
</html>
